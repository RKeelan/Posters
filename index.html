<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Posters</title>
<style>*{box-sizing:border-box}
:root{--bg:#fbfaf7;--fg:#1b1b19;--mut:#6f6f69;--card:#fff;--line:#e3dfd5;--code:#f5f3ed;--acc:#8a3a12;--sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",Menlo,"DejaVu Sans Mono",monospace}
@media (prefers-color-scheme:dark){:root{--bg:#15171a;--fg:#e3e3e0;--mut:#98988f;--card:#1d2024;--line:#2f343a;--code:#15181b;--acc:#e0a06c}}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.35}
.w{margin:0;padding:16px;max-width:900px}
h1{font-size:22px;margin:2px 0;letter-spacing:-.01em}
.sub{color:var(--mut);font-size:12px;margin:0 0 14px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.c{display:block;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 11px;text-decoration:none;color:inherit}
.c:hover,.c:focus-visible{border-color:var(--acc)}
.c h2{font-size:13px;margin:0 0 7px;color:var(--acc);border-bottom:1px solid var(--line);padding-bottom:5px}
.c p{margin:0;font-size:12.5px;color:var(--mut)}
</style>
</head>
<body>
<div class=w>
<h1>Posters</h1>
<p class=sub>One-page references, built to be read on a screen or printed on a single sheet.</p>
<div class=g>
<a class=c href="python.html"><h2>Python</h2><p>Python fundamentals</p></a>
</div>
</div>
</body>
</html>
